<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero — exact screenshot structure, real copy</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; color:#e9e7df; font-family:'Inter',sans-serif; overflow-x:hidden; }
  .hero { position:relative; padding:80px 0 160px; min-height:820px; }
  .ghost { position:absolute; top:20px; left:-30px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:280px; line-height:1; color:transparent; -webkit-text-stroke:1px #a06bff; letter-spacing:-0.02em; z-index:0; opacity:0.35; }
  .eyebrow { position:relative; z-index:2; padding-left:64px; padding-top:260px; font-family:'JetBrains Mono',monospace; font-size:15px; color:#a09c92; }
  .eyebrow b { color:#a06bff; font-weight:500; }
  .headline { position:relative; z-index:2; padding-left:64px; margin-top:20px; }
  .headline .l1, .headline .l2 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:64px; line-height:1.15; color:#e9e7df; }
  .headline .l3 { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:80px; line-height:1.15; color:#a06bff; margin-left:70px; margin-top:4px; }
  .sub { position:relative; z-index:2; margin-top:60px; margin-left:400px; max-width:440px; font-size:17px; line-height:1.7; color:#a09c92; padding-left:24px; border-left:2px solid #a06bff; }
  @media (max-width:900px){
    .ghost{ font-size:110px; top:10px; }
    .eyebrow, .headline{ padding-left:24px; }
    .eyebrow{ padding-top:110px; }
    .headline .l1, .headline .l2{ font-size:30px; } .headline .l3{ font-size:38px; margin-left:0; }
    .sub{ margin-left:24px; margin-top:32px; }
  }
</style>
</head>
<body>
<section class="hero">
  <div class="ghost">OBSESSED</div>
  <div class="eyebrow">// <b>ux_consultant</b> · product_design · web_experience</div>
  <div class="headline">
    <div class="l1">Pattern reader.</div>
    <div class="l2">Built together.</div>
    <div class="l3">Business-obsessed.</div>
  </div>
  <p class="sub">I catch what's off before I can explain why. Then I bring you in to build the rest.</p>
</section>
</body>
</html>
