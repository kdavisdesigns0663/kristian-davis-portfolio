<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work index — scattered, equal weight</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; color:#e9e7df; font-family:'Inter',sans-serif; padding:60px 40px 200px; }
  .toggle { position:fixed; top:20px; right:20px; z-index:10; background:#1c1c1a; color:#a09c92; border:1px solid #3a3a38; padding:10px 16px; font-size:13px; cursor:pointer; border-radius:4px; }
  .grid-wrap { position:relative; max-width:1200px; margin:80px auto 0; min-height:760px; }
  .gridlines { position:absolute; inset:0; display:grid; grid-template-columns:repeat(12,1fr); gap:24px; pointer-events:none; z-index:0; }
  .gridlines .col { border-left:1px dashed #2a2a28; height:100%; }
  .gridlines .col:last-child { border-right:1px dashed #2a2a28; }
  .gridlines.hidden { opacity:0; }
  .entry { position:absolute; cursor:pointer; z-index:2; }
  .entry .title { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:48px; color:#e9e7df; transition:color .3s ease, opacity .3s ease; line-height:1.05; letter-spacing:-0.01em; }
  .entry .hook { font-size:13px; color:#5a5754; margin-top:8px; max-width:220px; }
  .entry:hover .title { color:#a06bff; }
  .grid-wrap:hover .entry:not(:hover) .title { opacity:0.35; }
  .e1 { top:0px;   left:0px;   }
  .e2 { top:160px; left:540px; }
  .e3 { top:40px;  left:900px; }
  .e4 { top:400px; left:120px; }
  .e5 { top:520px; left:680px; }
</style>
</head>
<body>
<button class="toggle" onclick="document.querySelector('.gridlines').classList.toggle('hidden')">toggle grid</button>
<div class="grid-wrap">
  <div class="gridlines">
    <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
    <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
    <div class="col"></div><div class="col"></div><div class="col"></div><div class="col"></div>
  </div>
  <div class="entry e1"><div class="title">Nitefind</div><div class="hook">too many options, not enough certainty</div></div>
  <div class="entry e2"><div class="title">Zentra</div><div class="hook">saving money without losing motivation</div></div>
  <div class="entry e3"><div class="title">SmiteForge</div><div class="hook">one brand, two very different platforms</div></div>
  <div class="entry e4"><div class="title">Freya Sews</div><div class="hook">one identity, three very different services</div></div>
  <div class="entry e5"><div class="title">Amun</div><div class="hook">still being built</div></div>
</div>
</body>
</html>
