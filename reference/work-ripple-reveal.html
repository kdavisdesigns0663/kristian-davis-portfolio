<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Work section — scroll-triggered ripple + center bloom preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; font-family:sans-serif; }
  .spacer { height:100vh; display:flex; align-items:center; justify-content:center; color:#5a5754; font-size:14px; }
  .stage { position:relative; width:600px; height:600px; margin:0 auto; }
  .drop { position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; background:#a06bff; transform:translate(-50%,-50%); box-shadow:0 0 20px 4px rgba(160,107,255,0.6); z-index:3; }
  .ring { position:absolute; top:50%; left:50%; border:1px solid #a06bff; border-radius:50%; transform:translate(-50%,-50%); opacity:0; }
  .node { position:absolute; opacity:0; color:#e9e7df; font-size:20px; font-weight:700; white-space:nowrap; cursor:pointer; z-index:2; transition:opacity .3s ease, color .3s ease; }
  .node .hook { font-size:11px; color:#7a7770; font-weight:400; margin-top:4px; }
  .node:hover { color:#a06bff; }
  .stage.hovering .node:not(:hover) { opacity:0.25 !important; }

  /* Preview bloom, anchored at the exact center, appears above everything on hover */
  .preview { position:absolute; top:50%; left:50%; width:80px; height:52px; transform:translate(-50%,-50%) scale(0.3); opacity:0; border-radius:12px; overflow:hidden; z-index:4; pointer-events:none; transition:opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
  .preview.active { opacity:1; transform:translate(-50%,-50%) scale(1); width:320px; height:200px; }
  .preview::before { content:""; position:absolute; inset:-40px; filter:blur(40px); opacity:0.5; border-radius:50%; }
  .preview .bar { height:12%; }
  .preview .body { height:88%; display:flex; flex-direction:column; justify-content:center; gap:8px; padding:0 20px; }
  .preview .body span { display:block; height:8px; border-radius:4px; opacity:0.7; }

  .nitefind::before { background:radial-gradient(circle,#b04ad6,transparent 65%); } .nitefind .body { background:#12081a; } .nitefind .bar { background:#2a0f3a; } .nitefind .body span { background:#b04ad6; }
  .smiteforge::before { background:radial-gradient(circle,#e0b84a,transparent 65%); } .smiteforge .body { background:#0d0a03; } .smiteforge .bar { background:#2b2205; } .smiteforge .body span { background:#e0b84a; }
  .zentra::before { background:radial-gradient(circle,#4a8fd6,transparent 65%); } .zentra .body { background:#0d1a26; } .zentra .bar { background:#173049; } .zentra .body span { background:#4a8fd6; }
  .amun::before { background:radial-gradient(circle,#8f8f8f,transparent 65%); } .amun .body { background:#0a0a0a; } .amun .bar { background:#222; } .amun .body span { background:#8f8f8f; }

  .replay { position:fixed; top:20px; right:20px; background:#1c1c1a; color:#a09c92; border:1px solid #3a3a38; padding:10px 16px; font-size:13px; cursor:pointer; border-radius:4px; }
</style>
</head>
<body>

<button class="replay" onclick="location.reload()">replay</button>
<div class="spacer">scroll down</div>

<div class="stage" id="stage">
  <div class="drop"></div>
</div>

<div class="spacer"></div>

<script>
const stage = document.getElementById('stage');
const cx = 300, cy = 300;

const projects = [
  { key:'nitefind', name:'Nitefind', hook:'too many options, not enough certainty', angle:-90, radius:220 },
  { key:'smiteforge', name:'SmiteForge', hook:'one brand, two very different platforms', angle:0, radius:220 },
  { key:'zentra', name:'Zentra', hook:'saving money without losing motivation', angle:90, radius:220 },
  { key:'amun', name:'Amun', hook:'still being built', angle:180, radius:220 },
];

function place(el, angle, radius) {
  const rad = angle * Math.PI / 180;
  const x = cx + radius * Math.cos(rad);
  const y = cy + radius * Math.sin(rad);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.transform = (angle > -45 && angle < 135) ? 'translate(0,-50%)' : 'translate(-100%,-50%)';
}

projects.forEach(p => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML = `<div>${p.name}</div><div class="hook">${p.hook}</div>`;
  place(el, p.angle, p.radius);
  stage.appendChild(el);
  p.el = el;

  const preview = document.createElement('div');
  preview.className = 'preview ' + p.key;
  preview.innerHTML = `<div class="bar"></div><div class="body"><span style="width:70%"></span><span style="width:45%"></span></div>`;
  stage.appendChild(preview);
  p.preview = preview;

  el.addEventListener('mouseenter', () => {
    stage.classList.add('hovering');
    preview.classList.add('active');
  });
  el.addEventListener('mouseleave', () => {
    stage.classList.remove('hovering');
    preview.classList.remove('active');
  });
});

let played = false;
function playRipple() {
  if (played) return;
  played = true;
  let delay = 200;
  [1,2,3].forEach(() => {
    const ring = document.createElement('div');
    ring.className = 'ring';
    stage.insertBefore(ring, stage.firstChild);
    setTimeout(() => {
      ring.style.transition = 'width 1.3s ease-out, height 1.3s ease-out, opacity 1.3s ease-out';
      ring.style.opacity = '0.5';
      requestAnimationFrame(() => {
        ring.style.width = ring.style.height = '440px';
        ring.style.opacity = '0';
      });
    }, delay);
    delay += 220;
  });
  projects.forEach((p, i) => {
    setTimeout(() => {
      p.el.style.transition = 'opacity 0.6s ease';
      p.el.style.opacity = '1';
    }, 450 + i * 170);
  });
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting) playRipple(); });
}, { threshold: 0.5 });
observer.observe(stage);
</script>

</body>
</html>
