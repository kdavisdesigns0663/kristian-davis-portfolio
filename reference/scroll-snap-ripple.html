<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scroll-snap sections + reliable ripple trigger</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
  body { background:#050505; font-family:sans-serif; color:#e9e7df; }

  section { height:100vh; scroll-snap-align:start; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center; position:relative; border-bottom:1px solid #1c1c1a; }

  .label { position:absolute; top:24px; left:24px; font-size:12px; color:#5a5754; }

  .stage { position:relative; width:600px; height:600px; }
  .drop { position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; background:#a06bff; transform:translate(-50%,-50%); box-shadow:0 0 20px 4px rgba(160,107,255,0.6); z-index:3; }
  .ring { position:absolute; top:50%; left:50%; border:1px solid #a06bff; border-radius:50%; transform:translate(-50%,-50%); opacity:0; }
  .node { position:absolute; opacity:0; color:#e9e7df; font-size:20px; font-weight:700; white-space:nowrap; cursor:pointer; z-index:2; transition:opacity .3s ease, color .3s ease; }
  .node .hook { font-size:11px; color:#7a7770; font-weight:400; margin-top:4px; }
  .node:hover { color:#a06bff; }

  .replay { position:fixed; top:20px; right:20px; background:#1c1c1a; color:#a09c92; border:1px solid #3a3a38; padding:10px 16px; font-size:13px; cursor:pointer; border-radius:4px; z-index:10; }
</style>
</head>
<body>

<button class="replay" onclick="location.reload()">replay</button>

<section id="hero">
  <div class="label">section 1 — hero (placeholder)</div>
  <div style="font-size:14px; color:#5a5754;">scroll down, should hard-stop on next section</div>
</section>

<section id="work">
  <div class="label">section 2 — work (ripple should fire the moment this section fully snaps into view)</div>
  <div class="stage" id="stage">
    <div class="drop"></div>
  </div>
</section>

<section id="about">
  <div class="label">section 3 — about (placeholder)</div>
</section>

<script>
const stage = document.getElementById('stage');
const cx = 300, cy = 300;
const projects = [
  { name:'Nitefind', hook:'too many options, not enough certainty', angle:-90, radius:220 },
  { name:'SmiteForge', hook:'one brand, two very different platforms', angle:0, radius:220 },
  { name:'Zentra', hook:'saving money without losing motivation', angle:90, radius:220 },
  { name:'Amun', hook:'still being built', angle:180, radius:220 },
];
function place(el, angle, radius) {
  const rad = angle * Math.PI / 180;
  el.style.left = (cx + radius*Math.cos(rad)) + 'px';
  el.style.top = (cy + radius*Math.sin(rad)) + 'px';
  el.style.transform = (angle > -45 && angle < 135) ? 'translate(0,-50%)' : 'translate(-100%,-50%)';
}
projects.forEach(p => {
  const el = document.createElement('div');
  el.className = 'node';
  el.innerHTML = `<div>${p.name}</div><div class="hook">${p.hook}</div>`;
  place(el, p.angle, p.radius);
  stage.appendChild(el);
  p.el = el;
});

let played = false;
function playRipple() {
  if (played) return;
  played = true;
  let delay = 200;
  [1,2,3].forEach(() => {
    const ring = document.createElement('div');
    ring.className = 'ring';
    stage.insertBefore(ring, stage.firstChild);
    setTimeout(() => {
      ring.style.transition = 'width 1.3s ease-out, height 1.3s ease-out, opacity 1.3s ease-out';
      ring.style.opacity = '0.5';
      requestAnimationFrame(() => {
        ring.style.width = ring.style.height = '440px';
        ring.style.opacity = '0';
      });
    }, delay);
    delay += 220;
  });
  projects.forEach((p, i) => {
    setTimeout(() => {
      p.el.style.transition = 'opacity 0.6s ease';
      p.el.style.opacity = '1';
    }, 450 + i * 170);
  });
}

// Observe the SECTION itself (guaranteed 100vh via scroll-snap), not just the inner stage.
// threshold 0.9 means it only fires once the section is almost entirely in view,
// which scroll-snap guarantees will happen cleanly since sections hard-stop full-viewport.
const workSection = document.getElementById('work');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting) playRipple(); });
}, { threshold: 0.9 });
observer.observe(workSection);
</script>

</body>
</html>
