<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raindrop v4 — fixed ring animation, X layout, decoupled shape/stretch</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-snap-type: y mandatory; }
  body { background:#050505; font-family:sans-serif; color:#e9e7df; }
  section { height:100vh; scroll-snap-align:start; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; border-bottom:1px solid #1c1c1a; }
  .label { position:absolute; top:24px; left:24px; font-size:12px; color:#5a5754; }
  .replay { position:fixed; top:20px; right:20px; background:#1c1c1a; color:#a09c92; border:1px solid #3a3a38; padding:10px 16px; font-size:13px; cursor:pointer; border-radius:4px; z-index:10; }

  .stage { position:relative; width:600px; height:600px; max-width:90vw; max-height:90vw; }

  /* Wrapper handles vertical fall + squash/stretch, in true screen-space (not rotated) */
  .drop-wrap {
    position:absolute; left:50%; top:-50px; transform:translateX(-50%) scaleY(1);
    z-index:5; opacity:0;
  }
  .drop-wrap.falling {
    opacity:1;
    transition:top 1.2s cubic-bezier(.45,0,.4,1), transform 1.2s cubic-bezier(.45,0,.4,1);
    top:50%; transform:translateX(-50%) scaleY(1.4);
  }
  .drop-wrap.impact { transition:transform 0.16s ease-out, opacity 0.22s ease-out 0.05s; transform:translateX(-50%) scaleY(0.4); opacity:0; }

  /* Shape handles rotation only, isolated from the stretch above so it never skews */
  .drop-shape {
    width:12px; height:12px; background:#a06bff;
    box-shadow:0 0 14px 3px rgba(160,107,255,0.55);
    border-radius:50% 50% 50% 0; transform:rotate(135deg);
  }

  .impact-flash { position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; background:#fff; transform:translate(-50%,-50%) scale(1); opacity:0; z-index:4; }
  .impact-flash.flash { transition:transform 0.4s ease-out, opacity 0.4s ease-out; transform:translate(-50%,-50%) scale(6); opacity:0; }

  /* Ring starts at an explicit 0x0 so the transition to 440px actually animates */
  .ring { position:absolute; top:50%; left:50%; width:0; height:0; border:3px solid #a06bff; border-radius:50%; transform:translate(-50%,-50%); opacity:0; filter:blur(0px); }

  .node { position:absolute; top:50%; left:50%; opacity:0; color:#e9e7df; font-size:20px; font-weight:700; white-space:nowrap; text-align:center; cursor:pointer; z-index:2; transform:translate(-50%,-50%) scale(0.3); filter:blur(8px); transition:opacity 0.9s ease, transform 1.3s cubic-bezier(.34,1.56,.64,1), filter 1.1s ease-out; }
  .node .hook { font-size:11px; color:#7a7770; font-weight:400; margin-top:4px; }
  .node:hover, .node:focus { color:#a06bff; }
  .node.placed { opacity:1; filter:blur(0px); }
  .stage.hovering .node:not(:hover) { opacity:0.25 !important; }

  .preview { position:absolute; top:50%; left:50%; width:80px; height:52px; transform:translate(-50%,-50%) scale(0.3); opacity:0; border-radius:12px; overflow:hidden; z-index:6; pointer-events:none; transition:opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1); }
  .preview.active { opacity:1; transform:translate(-50%,-50%) scale(1); width:320px; height:200px; }
  .preview::before { content:""; position:absolute; inset:-40px; filter:blur(40px); opacity:0.5; border-radius:50%; }
  .preview .bar { height:12%; }
  .preview .body { height:88%; display:flex; flex-direction:column; justify-content:center; gap:8px; padding:0 20px; }
  .preview .body span { display:block; height:8px; border-radius:4px; opacity:0.7; }
  .preview.nitefind::before { background:radial-gradient(circle,#b04ad6,transparent 65%); } .preview.nitefind .body { background:#12081a; } .preview.nitefind .bar { background:#2a0f3a; } .preview.nitefind .body span { background:#b04ad6; }
  .preview.smiteforge::before { background:radial-gradient(circle,#e0b84a,transparent 65%); } .preview.smiteforge .body { background:#0d0a03; } .preview.smiteforge .bar { background:#2b2205; } .preview.smiteforge .body span { background:#e0b84a; }
  .preview.zentra::before { background:radial-gradient(circle,#4a8fd6,transparent 65%); } .preview.zentra .body { background:#0d1a26; } .preview.zentra .bar { background:#173049; } .preview.zentra .body span { background:#4a8fd6; }
  .preview.amun::before { background:radial-gradient(circle,#8f8f8f,transparent 65%); } .preview.amun .body { background:#0a0a0a; } .preview.amun .bar { background:#222; } .preview.amun .body span { background:#8f8f8f; }
</style>
</head>
<body>

<button class="replay" onclick="location.reload()">replay</button>
<section id="spacer1"><div class="label">scroll down</div></section>

<section id="work">
  <div class="label">X layout. scroll away and back to test reset.</div>
  <div class="stage" id="stage">
    <div class="drop-wrap" id="dropWrap"><div class="drop-shape"></div></div>
    <div class="impact-flash" id="flash"></div>
  </div>
</section>

<section id="spacer2"></section>

<script>
const stage = document.getElementById('stage');
const dropWrap = document.getElementById('dropWrap');
const flash = document.getElementById('flash');

// X layout: 45/135/225/315 instead of cardinal 0/90/180/270 -- same equal-angle,
// equal-radius rule, just rotated 45deg so it reads as an X, not a cross.
const projects = [
  { key:'nitefind', name:'Nitefind', hook:'too many options, not enough certainty', angle:-45, radius:220 },
  { key:'smiteforge', name:'SmiteForge', hook:'one brand, two very different platforms', angle:45, radius:220 },
  { key:'zentra', name:'Zentra', hook:'saving money without losing motivation', angle:135, radius:220 },
  { key:'amun', name:'Amun', hook:'still being built', angle:225, radius:220 },
];

projects.forEach(p => {
  const el = document.createElement('div');
  el.className = 'node';
  el.tabIndex = 0;
  el.innerHTML = `<div>${p.name}</div><div class="hook">${p.hook}</div>`;
  stage.appendChild(el);
  p.el = el;

  const preview = document.createElement('div');
  preview.className = 'preview ' + p.key;
  preview.innerHTML = `<div class="bar"></div><div class="body"><span style="width:70%"></span><span style="width:45%"></span></div>`;
  stage.appendChild(preview);

  const on = () => { stage.classList.add('hovering'); preview.classList.add('active'); };
  const off = () => { stage.classList.remove('hovering'); preview.classList.remove('active'); };
  el.addEventListener('mouseenter', on);
  el.addEventListener('mouseleave', off);
  el.addEventListener('focus', on);
  el.addEventListener('blur', off);
});

function targetTransform(angle, radius) {
  const rad = angle * Math.PI / 180;
  const x = radius * Math.cos(rad);
  const y = radius * Math.sin(rad);
  return `translate(${x}px, ${y}px)`;
}

let played = false;
let timers = [];
function clearTimers() { timers.forEach(t => clearTimeout(t)); timers = []; }

function resetSequence() {
  played = false;
  clearTimers();
  dropWrap.classList.remove('falling', 'impact');
  dropWrap.style.opacity = '0';
  flash.classList.remove('flash');
  stage.querySelectorAll('.ring').forEach(r => r.remove());
  projects.forEach(p => {
    p.el.classList.remove('placed');
    p.el.style.transform = 'translate(-50%,-50%) scale(0.3)';
  });
}

function playSequence() {
  if (played) return;
  played = true;

  timers.push(setTimeout(() => { dropWrap.classList.add('falling'); }, 30));

  timers.push(setTimeout(() => {
    dropWrap.classList.add('impact');
    flash.classList.add('flash');

    let delay = 0;
    [1, 2, 3, 4].forEach(() => {
      const ring = document.createElement('div');
      ring.className = 'ring';
      const r1 = 48 + Math.random()*6, r2 = 48 + Math.random()*6, r3 = 48 + Math.random()*6, r4 = 48 + Math.random()*6;
      ring.style.borderRadius = `${r1}% ${r2}% ${r3}% ${r4}%`;
      stage.insertBefore(ring, stage.firstChild);
      timers.push(setTimeout(() => {
        ring.style.transition = 'width 1.5s ease-out, height 1.5s ease-out, opacity 1.5s ease-out, filter 1.5s ease-out, border-width 1.5s ease-out';
        ring.style.opacity = '0.55';
        ring.offsetHeight;
        ring.style.width = ring.style.height = (400 + Math.random()*60) + 'px';
        ring.style.opacity = '0';
        ring.style.filter = 'blur(5px)';
        ring.style.borderWidth = '0.5px';
      }, delay));
      delay += 420;
    });

    projects.forEach((p, i) => {
      timers.push(setTimeout(() => {
        p.el.style.transform = `translate(-50%,-50%) ${targetTransform(p.angle, p.radius)} scale(1)`;
        p.el.classList.add('placed');
      }, i * 50));
    });
  }, 1220));
}

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) playSequence();
    else resetSequence();
  });
}, { threshold: 0.9 });
observer.observe(document.getElementById('work'));
</script>

</body>
</html>
