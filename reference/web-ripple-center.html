<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Web layout — ripple center</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; padding:60px; }
  .web { position:relative; width:440px; height:440px; margin:0 auto; }
  .spoke { position:absolute; top:50%; left:50%; height:1px; background:linear-gradient(to right, #a06bff, transparent); transform-origin:0 0; opacity:0.45; }
  .node { position:absolute; width:10px; height:10px; border-radius:50%; background:#e9e7df; transform:translate(-50%,-50%); }
  .label { position:absolute; font-family:sans-serif; font-size:12px; color:#8a8780; white-space:nowrap; }
  .ripple { position:absolute; top:50%; left:50%; border-radius:50%; border:1px solid #a06bff; transform:translate(-50%,-50%); }
</style>
</head>
<body>
<div class="web" id="web"></div>
<script>
  const names = ['Nitefind','SmiteForge','Zentra','Freya Sews','Amun'];
  const web = document.getElementById('web');
  const radius = 170;
  for (let i = 0; i < 5; i++) {
    const angle = (360/5)*i - 90;
    const rad = angle * Math.PI/180;
    const x = 220 + radius*Math.cos(rad);
    const y = 220 + radius*Math.sin(rad);
    const spoke = document.createElement('div');
    spoke.className = 'spoke';
    spoke.style.width = radius+'px';
    spoke.style.transform = `rotate(${angle}deg)`;
    web.appendChild(spoke);
    const node = document.createElement('div');
    node.className = 'node';
    node.style.left = x+'px'; node.style.top = y+'px';
    web.appendChild(node);
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = names[i];
    label.style.left = (x+12)+'px'; label.style.top = (y-6)+'px';
    web.appendChild(label);
  }
  // three concentric ripple rings, fading outward
  [30, 55, 82].forEach((r, i) => {
    const ring = document.createElement('div');
    ring.className = 'ripple';
    ring.style.width = ring.style.height = (r*2)+'px';
    ring.style.opacity = 0.5 - i*0.15;
    web.appendChild(ring);
  });
</script>
</body>
</html>
