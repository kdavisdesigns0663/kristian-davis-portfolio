<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo treatment — duotone, asymmetric crop</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050505; padding:60px 40px; }
  .frame {
    position:relative; width:420px; height:520px; overflow:hidden;
    margin-left:0;
  }
  .frame img {
    width:100%; height:100%; object-fit:cover; object-position:60% 20%;
    filter:grayscale(1) contrast(1.15) brightness(0.95);
  }
  .frame::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(160,107,255,0.35), rgba(5,5,5,0.55) 70%);
    mix-blend-mode:multiply;
  }
  .frame::before {
    content:""; position:absolute; right:0; top:0; bottom:0; width:60px;
    background:linear-gradient(90deg, transparent, #050505);
    z-index:2;
  }
  .label { color:#5a5754; font-family:sans-serif; font-size:13px; margin-top:16px; }
</style>
</head>
<body>
  <div class="frame"><img src="kristian.jpeg" alt="portrait, duotone treatment"></div>
  <div class="label">duotone (black + violet), asymmetric crop, edge fades into background instead of a hard box</div>
</body>
</html>
